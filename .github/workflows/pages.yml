name: Alpha Watch Data Refresh

on:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "taiwan_data.json"
      - "crypto_data.json"
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade yfinance pandas_market_calendars

      - name: Build live market data
        run: python scripts/update_data.py

      - name: Save latest data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json taiwan_data.json crypto_data.json
          git diff --cached --quiet || git commit -m "Update live market data"
          git push

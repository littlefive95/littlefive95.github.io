name: Alpha Watch Data Refresh

on:
  push:
    branches: [main]
    # Only pipeline/workflow changes trigger an immediate rebuild. UI/docs edits
    # should not start unnecessary market-data jobs or race with publication.
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/pages.yml"
  # Run every 15 minutes, offset from common quarter-hour boundaries.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never cancel a running refresh. A concurrent trigger may wait pending until
# the running build finishes, rather than cutting off data publication.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade yfinance pandas_market_calendars

      - name: Validate data pipeline code
        run: |
          python -m py_compile scripts/update_data.py
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/index.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/index.js

      - name: Backup last known good snapshots
        run: |
          mkdir -p .data-backup
          for f in data.json taiwan_data.json crypto_data.json; do
            if [ -f "$f" ]; then cp "$f" ".data-backup/$f"; fi
          done

      - name: Build live market data (retry transient provider failures)
        run: |
          # Yahoo Finance and crypto APIs occasionally return transient errors.
          # Retry the full build before falling back to the last good snapshots.
          for attempt in 1 2 3; do
            echo "Market data build attempt ${attempt}/3"
            if ! python scripts/update_data.py; then
              echo "Build command returned non-zero on attempt ${attempt}."
            fi

            if python - <<'PY'
          import json
          from pathlib import Path
          problems = []
          for name in ("data.json", "taiwan_data.json", "crypto_data.json"):
              try:
                  payload = json.loads(Path(name).read_text(encoding="utf-8"))
                  rows = payload.get("rows")
                  if payload.get("status") == "DATA_ERROR" or not isinstance(rows, list) or not rows:
                      problems.append(f"{name}: DATA_ERROR or empty rows")
                  if payload.get("fallback"):
                      problems.append(f"{name}: fallback snapshot still present")
                  backup_path = Path(".data-backup") / name
                  if backup_path.exists():
                      previous = json.loads(backup_path.read_text(encoding="utf-8"))
                      if payload.get("asOf") == previous.get("asOf"):
                          problems.append(f"{name}: asOf did not advance")
              except Exception as exc:
                  problems.append(f"{name}: invalid snapshot ({exc})")
          if problems:
              print("Build validation failed:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print("All three snapshots rebuilt successfully.")
          PY
            then
              echo "Market data build succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Transient or incomplete build; waiting 15 seconds before retry."
              sleep 15
            fi
          done

          echo "::warning::All build retries exhausted; the next step will restore last-good snapshots and freshness validation will raise an alert if data is stale."
          # Allow the fallback step to run; stale data remains a visible failure
          # in the Verify snapshot freshness step rather than losing the snapshot.

      - name: Keep last known good data on provider failure
        run: |
          python - <<'PY'
          import json
          import pathlib
          
          for name in ("data.json", "taiwan_data.json", "crypto_data.json"):
              current = pathlib.Path(name)
              backup = pathlib.Path(".data-backup") / name
              try:
                  payload = json.loads(current.read_text(encoding="utf-8"))
              except Exception:
                  payload = {"status": "DATA_ERROR", "error": "invalid JSON"}
              rows = payload.get("rows") if isinstance(payload, dict) else None
              if payload.get("status") == "DATA_ERROR" or not isinstance(rows, list) or not rows:
                  if not backup.exists():
                      continue
                  try:
                      old = json.loads(backup.read_text(encoding="utf-8"))
                      old_rows = old.get("rows") if isinstance(old, dict) else None
                      if isinstance(old_rows, list) and old_rows:
                          old["fallback"] = True
                          old["refreshCheckedAt"] = payload.get("asOf")
                          old["refreshError"] = payload.get("error", "本次資料來源更新失敗")
                          current.write_text(json.dumps(old, ensure_ascii=False, indent=2), encoding="utf-8")
                          print(f"{name}: restored last known good snapshot")
                  except Exception as exc:
                      print(f"{name}: restore warning: {exc}")

      - name: Validate market snapshots
        run: |
          python - <<'PY'
          import json
          for name in ("data.json", "taiwan_data.json", "crypto_data.json"):
              with open(name, encoding="utf-8") as f:
                  payload = json.load(f)
              rows = payload.get("rows")
              if not isinstance(rows, list) or not rows:
                  raise SystemExit(f"{name}: no usable rows after refresh/fallback")
              if len(rows) > 20:
                  raise SystemExit(f"{name}: more than TOP 20 rows")
              print(f"{name}: {payload.get('status')} {len(rows)} rows")
          PY

      - name: Save latest data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry if a code/docs commit updates main while market data is building.
          for attempt in 1 2 3; do
            git add data.json taiwan_data.json crypto_data.json
            if git diff --cached --quiet; then
              echo "Market snapshots already match the remote branch."
              exit 0
            fi
            git commit -m "Update live market data"
            if git push origin HEAD:main; then
              echo "Market snapshots published."
              exit 0
            fi
            echo "Push attempt ${attempt} conflicted with a newer main; fetching and retrying."
            git fetch origin main
            git reset --mixed origin/main
          done
          echo "::error::Could not publish snapshots after 3 attempts."
          exit 1

      # Keep fallback snapshots published, but mark the run as failed so an
      # alert is emitted whenever a provider failure leaves stale data behind.
      - name: Verify snapshot freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          problems = []
          for name in ("data.json", "taiwan_data.json", "crypto_data.json"):
              payload = json.loads(Path(name).read_text(encoding="utf-8"))
              raw = payload.get("asOf")
              try:
                  as_of = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                  if as_of.tzinfo is None:
                      as_of = as_of.replace(tzinfo=timezone.utc)
                  age_minutes = (now - as_of.astimezone(timezone.utc)).total_seconds() / 60
              except Exception:
                  problems.append(f"{name}: invalid or missing asOf")
                  continue
              if payload.get("fallback"):
                  problems.append(f"{name}: fallback snapshot was used")
              if age_minutes > 60:
                  problems.append(f"{name}: snapshot is {age_minutes:.0f} minutes old")
              elif age_minutes < -5:
                  problems.append(f"{name}: asOf timestamp is unexpectedly in the future")
              else:
                  print(f"{name}: freshness OK ({age_minutes:.1f} minutes old)")
          if problems:
              print("Freshness problems:")
              for item in problems:
                  print(f" - {item}")
              raise SystemExit(1)
          PY

      - name: Alert on refresh failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[Alpha Watch] Data refresh failed or snapshots stale";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "Alpha Watch 的資料更新工作失敗，或至少一份資料快照超過 60 分鐘／使用了 last-good fallback。",
              "",
              `- Workflow run: ${runUrl}`,
              `- Event: ${context.eventName}`,
              `- Commit: ${context.sha}`,
              `- Time (UTC): ${new Date().toISOString()}`,
              "",
              "請查看 workflow 的 Build live market data、Validate market snapshots 與 Verify snapshot freshness 日誌。"
            ].join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
              const assignees = (existing.assignees || []).map(user => user.login);
              if (!assignees.includes(owner)) {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: existing.number, assignees: [owner]
                });
              }
            } else {
              await github.rest.issues.create({
                owner, repo, title, assignees: [owner], body
              });
            }

      - name: Resolve refresh alert after recovery
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[Alpha Watch] Data refresh failed or snapshots stale";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `資料更新已恢復正常。最新成功的 workflow run：${runUrl}\n時間 (UTC)：${new Date().toISOString()}`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }

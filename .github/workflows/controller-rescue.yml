name: Alpha Watch Controller Rescue

on:
  # Event-based recovery when the long-running controller exits unexpectedly.
  workflow_run:
    workflows: ["Alpha Watch Continuous Refresh Controller"]
    types: [completed]
  # Backup liveness check in case workflow_run delivery is delayed.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/controller-rescue.yml"

permissions:
  actions: write

concurrency:
  group: alpha-watch-controller-rescue
  cancel-in-progress: false

jobs:
  ensure-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure a healthy refresh controller is active
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const controllerWorkflow = "data-refresh-controller.yml";
            const forceRestart = context.eventName === "push"
              && String(context.payload.head_commit?.message || "").includes("[force-controller-restart]");
            const staleAfterMinutes = 330;
            const activeStatuses = new Set([
              "queued", "in_progress", "waiting", "requested", "pending"
            ]);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: controllerWorkflow,
              branch: "main", per_page: 20
            });

            const now = Date.now();
            const active = data.workflow_runs.filter(run =>
              activeStatuses.has(run.status)
            );

            if (forceRestart) {
              core.warning("Force-restart marker detected; replacing the active controller with the updated retry-enabled version.");
              await Promise.all(active.map(async run => {
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`Cancellation requested for controller #${run.id} (${run.status}).`);
                } catch (error) {
                  core.warning(`Could not cancel controller #${run.id}: ${error.message}`);
                }
              }));

              let remaining = active;
              for (let attempt = 1; attempt <= 12; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                const latest = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: controllerWorkflow, branch: "main", per_page: 20
                });
                remaining = latest.data.workflow_runs.filter(run => activeStatuses.has(run.status));
                if (remaining.length === 0) break;
              }

              if (remaining.length > 0) {
                core.warning("A controller is still transitioning; dispatching the new version into the controller concurrency queue.");
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: controllerWorkflow, ref: "main"
              });
              core.info("Updated controller dispatch requested.");
              return;
            }

            const stale = active.filter(run => {
              const startedAt = run.run_started_at || run.created_at;
              return now - Date.parse(startedAt) > staleAfterMinutes * 60 * 1000;
            });

            for (const run of stale) {
              core.warning(
                `Controller run #${run.id} has been active for over ${staleAfterMinutes} minutes; requesting cancellation.`
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: run.id
                });
              } catch (error) {
                core.warning(`Could not cancel stale controller #${run.id}: ${error.message}`);
              }
            }

            const healthyOrQueued = active.filter(run => !stale.some(s => s.id === run.id));
            if (healthyOrQueued.length > 0) {
              core.info(
                "Controller already active/queued: " +
                healthyOrQueued.map(run => `#${run.id} (${run.status})`).join(", ")
              );
              return;
            }

            core.warning(
              `No healthy controller run found (trigger=${context.eventName}); dispatching a replacement.`
            );
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: controllerWorkflow, ref: "main"
            });
            core.info("Replacement controller dispatch requested.");
